<!doctype html>
<html lang="en">
  <head>
    <script>
      // Workaround for third-party scripts attempting to override fetch
      const originalFetch = window.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: () => originalFetch,
          set: (newFetch) => {
            Object.defineProperty(window, 'fetch', {
              configurable: true,
              enumerable: true,
              writable: true,
              value: newFetch
            });
          }
        });
      } catch (e) {
        console.warn('Could not polyfill fetch setter', e);
      }
    </script>
